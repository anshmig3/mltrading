version: "3.9"

services:
  api:
    build:
      context: ./stock_signal
      dockerfile: ../Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./stock_signal/data:/app/data
      - ./stock_signal/ml/models:/app/ml/models
    environment:
      - RH_USERNAME=${RH_USERNAME}
      - RH_PASSWORD=${RH_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DB_PATH=/app/data/stock_signal.db
      - DAILY_CLAUDE_BUDGET=${DAILY_CLAUDE_BUDGET:-0}
    command: python -m uvicorn api.app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  scheduler:
    build:
      context: ./stock_signal
      dockerfile: ../Dockerfile
    volumes:
      - ./stock_signal/data:/app/data
      - ./stock_signal/ml/models:/app/ml/models
    environment:
      - RH_USERNAME=${RH_USERNAME}
      - RH_PASSWORD=${RH_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DB_PATH=/app/data/stock_signal.db
    command: python scheduler/cron.py
    depends_on:
      - api
    restart: unless-stopped

  poller:
    build:
      context: ./stock_signal
      dockerfile: ../Dockerfile
    volumes:
      - ./stock_signal/data:/app/data
    environment:
      - RH_USERNAME=${RH_USERNAME}
      - RH_PASSWORD=${RH_PASSWORD}
      - DB_PATH=/app/data/stock_signal.db
    command: python data/poller.py
    depends_on:
      - api
    restart: unless-stopped

  dashboard:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./stock_signal/dashboard:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - api
